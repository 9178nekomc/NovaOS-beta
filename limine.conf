# limine.conf - Nova OS 阶段一：Limine v8.x 引导配置
#
# 注意：Limine v8.x 起配置文件格式已更新（选项用 "key: value"、
# 条目标题行不再以 ":" 结尾、路径使用 boot():/ 形式），
# 且文件名必须为 limine.conf（limine.cfg 仅为旧格式兼容，会触发 20 秒警告）。
# 语法详见 limine/CONFIG.md

timeout: 5

/Nova OS (x86_64)
    protocol: limine
    kernel_path: boot():/kernel.elf
    # 按项目硬性约束请求 GOP 分辨率 1920x1080x32bpp（不可用时 Limine 自动降级）
    resolution: 1920x1080x32
